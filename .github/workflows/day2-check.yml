name: Day 2 Check

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/day2-check.yml'

jobs:
  check-day2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Check file structure
        run: |
          echo "Проверка наличия файлов..."
          for f in docs/schema.sql docs/security.md docs/architecture.md docs/er_diagram.png; do
            if [ ! -f "$f" ]; then
              echo "FAIL: Файл $f не найден"
              exit 1
            fi
            echo "PASS: $f найден"
          done

      - name: Check file sizes
        run: |
          for f in docs/schema.sql docs/security.md docs/architecture.md; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 300 ]; then
              echo "FAIL: $f слишком маленький ($size байт, нужно >= 300)"
              exit 1
            fi
            echo "PASS: $f размер $size байт"
          done

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Execute DDL script
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d testdb -f docs/schema.sql
          echo "PASS: DDL-скрипт выполнен успешно"

      - name: Count tables
        env:
          PGPASSWORD: postgres
        run: |
          count=$(psql -h localhost -U postgres -d testdb -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          echo "Создано таблиц: $count"
          if [ "$count" -lt 5 ]; then
            echo "FAIL: Нужно минимум 5 таблиц, найдено $count"
            exit 1
          fi
          echo "PASS: Достаточно таблиц ($count)"

      - name: Count foreign keys
        env:
          PGPASSWORD: postgres
        run: |
          fk_count=$(psql -h localhost -U postgres -d testdb -t -c "SELECT count(*) FROM information_schema.table_constraints WHERE constraint_type='FOREIGN KEY' AND table_schema='public';")
          echo "Внешних ключей: $fk_count"
          if [ "$fk_count" -lt 5 ]; then
            echo "FAIL: Нужно минимум 5 FK, найдено $fk_count"
            exit 1
          fi
          echo "PASS: Достаточно FK ($fk_count)"

      - name: Check roles in security.md
        run: |
          for role in guest user organizer admin; do
            if ! grep -qi "$role" docs/security.md; then
              echo "FAIL: Роль '$role' не найдена в security.md"
              exit 1
            fi
            echo "PASS: Роль '$role' найдена"
          done

      - name: All checks passed
        run: echo "Все проверки Day 2 пройдены успешно!"
